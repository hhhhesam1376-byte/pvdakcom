---
# PVDak cPanel deployment
# Set PVDAK_DEPLOY_PATH to the exact PVDak Document Root on cPanel.
# The guard prevents accidental deployment to another site's document root.
deployment:
  tasks:
    - 'test -n "$PVDAK_DEPLOY_PATH" || { echo "PVDak deployment blocked - set PVDAK_DEPLOY_PATH to the exact Document Root"; exit 1; }'
    - 'test -d "$PVDAK_DEPLOY_PATH" || { echo "PVDak deployment blocked - destination does not exist"; exit 1; }'
    - 'test "$PVDAK_DEPLOY_PATH" != "/" && test "$PVDAK_DEPLOY_PATH" != "$HOME" || { echo "PVDak deployment blocked - unsafe destination"; exit 1; }'
    - '/bin/cp -f index.html "$PVDAK_DEPLOY_PATH/index.html"'
