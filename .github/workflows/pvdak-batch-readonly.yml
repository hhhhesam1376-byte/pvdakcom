name: PVDak canonical PHP and isolated D31 checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pvdak-batch-readonly.yml'
      - 'scripts/check-batch-readonly.sh'
      - 'tests/**'
      - '**/*.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v5
      - name: Show PHP CLI runtime
        run: php -v
      - name: Run canonical read-only PHP batch
        run: bash scripts/check-batch-readonly.sh

  d31-wordpress-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: pvdak_ci
          MARIADB_USER: pvdak_ci
          MARIADB_PASSWORD: pvdak_ci_local_only
          MARIADB_ROOT_PASSWORD: pvdak_ci_root_local_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v5
      - name: Install local PHP MySQL driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-mysql
          php -m | grep -Fx mysqli
      - name: Bootstrap disposable WordPress (no production credentials)
        shell: bash
        run: |
          set -Eeuo pipefail
          WP_ROOT="$RUNNER_TEMP/pvdak-wp"
          mkdir -p "$WP_ROOT/wp-content/themes/pvdakcom-main" "$WP_ROOT/wp-content/plugins"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$RUNNER_TEMP/wp-cli.phar"
          php "$RUNNER_TEMP/wp-cli.phar" core download --path="$WP_ROOT" --quiet
          tar -C "$GITHUB_WORKSPACE" --exclude=.git -cf - . | tar -C "$WP_ROOT/wp-content/themes/pvdakcom-main" -xf -
          cp -a "$GITHUB_WORKSPACE/packages/pvdak-core" "$WP_ROOT/wp-content/plugins/pvdak-core"
          wpci() { php "$RUNNER_TEMP/wp-cli.phar" --path="$WP_ROOT" "$@"; }
          wpci config create --dbname=pvdak_ci --dbuser=pvdak_ci --dbpass=pvdak_ci_local_only --dbhost=127.0.0.1 --skip-check --quiet
          wpci config set WP_ENVIRONMENT_TYPE local --type=constant --quiet
          wpci core install --url=http://127.0.0.1:8080 --title=PVDak-CI --admin_user=ciadmin --admin_password=ci_only_not_live --admin_email=ci@example.test --skip-email --quiet
          wpci theme activate pvdakcom-main --quiet
          wpci plugin activate pvdak-core --quiet
          echo "PVDAK_CI_WP_BOOTSTRAP_OK: disposable local WordPress and MariaDB"
      - name: Execute original theme code against WordPress and MariaDB
        shell: bash
        env:
          PVDAK_CI_D31_ISOLATED: '1'
        run: |
          set -Eeuo pipefail
          php "$RUNNER_TEMP/wp-cli.phar" --path="$RUNNER_TEMP/pvdak-wp" --user=ciadmin eval-file "$GITHUB_WORKSPACE/tests/pvdak-theme/d31-wordpress-mariadb-integration.php" | tee "$RUNNER_TEMP/pvdak-d31-wp-result.log"
      - name: Run D11/D12 isolated Core multiuser ownership E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          WP_ROOT="$RUNNER_TEMP/pvdak-wp"
          wpci() { php "$RUNNER_TEMP/wp-cli.phar" --path="$WP_ROOT" "$@"; }
          # This flag is a constant in the disposable CI WordPress only.
          # Never use the staging fixture on the real site or its database.
          wpci config set PVDAK_E2E_ISOLATED_STAGING true --raw --type=constant --quiet
          wpci option update pvdak_maintenance_enabled 1 --quiet
          cleanup() {
            wpci option update pvdak_maintenance_enabled 0 --quiet || true
          }
          trap cleanup EXIT
          wpci eval-file "$GITHUB_WORKSPACE/scripts/pvdak-staging-multiuser-e2e.php" |
            tee "$RUNNER_TEMP/pvdak-d11-multiuser.log"
          grep -F 'PVDAK_STAGING_MULTIUSER: checks=20 failures=0 expected=20 cleanup=OK' "$RUNNER_TEMP/pvdak-d11-multiuser.log"
          echo 'PVDAK_D11_MULTIUSER_CI_OK: 20/20 WordPress/Core ownership and cleanup checks; live host NOT_TESTED'
      - name: Check real localhost HTTP pagination, privacy and robots
        shell: bash
        env:
          PVDAK_CI_D31_ISOLATED: '1'
          PVDAK_CI_D11_ISOLATED: '1'
        run: |
          set -Eeuo pipefail
          export PVDAK_CI_D31_PARENT_ID PVDAK_CI_D31_LOGIN_ID PVDAK_CI_D31_ACCOUNT_ID
          PVDAK_CI_D31_PARENT_ID="$(sed -n 's/^PVDAK_D31_HTTP_PARENT_ID=//p' "$RUNNER_TEMP/pvdak-d31-wp-result.log" | tail -n 1)"
          PVDAK_CI_D31_LOGIN_ID="$(sed -n 's/^PVDAK_D31_HTTP_LOGIN_ID=//p' "$RUNNER_TEMP/pvdak-d31-wp-result.log" | tail -n 1)"
          PVDAK_CI_D31_ACCOUNT_ID="$(sed -n 's/^PVDAK_D31_HTTP_ACCOUNT_ID=//p' "$RUNNER_TEMP/pvdak-d31-wp-result.log" | tail -n 1)"
          [[ "$PVDAK_CI_D31_PARENT_ID" =~ ^[1-9][0-9]*$ && "$PVDAK_CI_D31_LOGIN_ID" =~ ^[1-9][0-9]*$ && "$PVDAK_CI_D31_ACCOUNT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "FAIL: missing disposable D31 parent/login/account"; exit 1; }
          # WP-CLI fixtures generate /pvdak-wp/wp-content asset URLs. Serve that
          # canonical prefix too; otherwise Chrome silently gets 404 CSS/JS.
          ln -s . "$RUNNER_TEMP/pvdak-wp/pvdak-wp"
          php -S 127.0.0.1:8080 -t "$RUNNER_TEMP/pvdak-wp" >"$RUNNER_TEMP/pvdak-d31-http-server.log" 2>&1 &
          server_pid=$!
          d11_fixture_ready=0
          cleanup() {
            rc=$?
            trap - EXIT
            rm -f "$RUNNER_TEMP/pvdak-wp/wp-content/mu-plugins/pvdak-d12-ci-nonce.php" || true
            if (( d11_fixture_ready == 1 )); then
              if ! PVDAK_CI_D11_MODE=cleanup php "$RUNNER_TEMP/wp-cli.phar" --path="$RUNNER_TEMP/pvdak-wp" eval-file "$GITHUB_WORKSPACE/tests/pvdak-theme/d11-browser-fixture.php"; then
                echo 'D11_BROWSER_CLEANUP_FAILED: isolated fixture requires review'
                rc=1
              fi
            fi
            if (( rc != 0 )); then tail -n 100 "$RUNNER_TEMP/pvdak-d31-http-server.log" || true; fi
            kill "$server_pid" 2>/dev/null || true
            exit "$rc"
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/?page_id=$PVDAK_CI_D31_PARENT_ID" >/dev/null; then ready=1; break; fi
            sleep 1
          done
          [[ "$ready" == 1 ]] || { echo "FAIL: local WordPress HTTP did not start"; exit 1; }
          python3 "$GITHUB_WORKSPACE/tests/pvdak-theme/d31-http-integration.py"
          # Ubuntu hosted runner includes Chrome; install only the small Playwright JS client.
          command -v google-chrome
          npm install --prefix "$RUNNER_TEMP/pvdak-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.0
          export NODE_PATH="$RUNNER_TEMP/pvdak-browser/node_modules"
          node "$GITHUB_WORKSPACE/tests/pvdak-theme/d31-browser-rtl.cjs"
          # D11 browser fixtures exist only during this isolated HTTP step.
          # EXIT trap deletes all synthetic users/records even if Chrome fails.
          PVDAK_CI_D11_MODE=setup php "$RUNNER_TEMP/wp-cli.phar" --path="$RUNNER_TEMP/pvdak-wp" eval-file "$GITHUB_WORKSPACE/tests/pvdak-theme/d11-browser-fixture.php"
          d11_fixture_ready=1
          # D12 REST dispatch uses the same guarded synthetic users/posts and
          # remains protected by the D11 EXIT cleanup trap on any failure.
          PVDAK_CI_D12_ISOLATED=1 php "$RUNNER_TEMP/wp-cli.phar" --path="$RUNNER_TEMP/pvdak-wp" eval-file "$GITHUB_WORKSPACE/tests/pvdak-theme/d12-rest-role-matrix.php"
          node "$GITHUB_WORKSPACE/tests/pvdak-theme/d11-browser-sessions.cjs"
          # D12 nonce issuer exists only as a MU plugin in disposable CI WordPress.
          # It requires a marked synthetic logged-in user and returns no live secrets.
          mkdir -p "$RUNNER_TEMP/pvdak-wp/wp-content/mu-plugins"
          cp "$GITHUB_WORKSPACE/tests/pvdak-theme/d12-ci-nonce-mu.php" "$RUNNER_TEMP/pvdak-wp/wp-content/mu-plugins/pvdak-d12-ci-nonce.php"
          PVDAK_CI_D12_ISOLATED=1 node "$GITHUB_WORKSPACE/tests/pvdak-theme/d12-rest-http.cjs"
          rm -f "$RUNNER_TEMP/pvdak-wp/wp-content/mu-plugins/pvdak-d12-ci-nonce.php"
      - name: Verify D30 file and SQL restore on disposable MariaDB
        shell: bash
        env:
          PVDAK_CI_D30_ISOLATED: '1'
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mariadb-server mariadb-client
          bash "$GITHUB_WORKSPACE/tests/pvdak-theme/d30-mariadb-restore-ci.sh"
