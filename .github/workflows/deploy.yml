name: Deploy PVDak to cPanel

on:
  # Production updates are pulled by the cPanel cron job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvdak-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the approved main branch
        uses: actions/checkout@v4

      - name: Check deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.PVDAK_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PVDAK_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.PVDAK_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PVDAK_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.PVDAK_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.PVDAK_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing PVDak deployment setting::Set ${name} in GitHub Actions secrets/variables first."
              exit 1
            fi
          done

          # Only allow ordinary absolute paths below /home/<cpanel-account>/.
          if [[ ! "$DEPLOY_PATH" =~ ^/home/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+/?$ ]] ||
             [[ "$DEPLOY_PATH" == *"/../"* ]] ||
             [[ "$DEPLOY_PATH" == *"/./"* ]]; then
            echo "::error title=Unsafe PVDak path::Use the exact cPanel Document Root below /home/<account>/."
            exit 1
          fi

          if [[ -n "$DEPLOY_PORT" && ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid SSH port::PVDAK_SSH_PORT must be numeric."
            exit 1
          fi

      - name: Prepare pinned SSH host key and deploy key
        env:
          DEPLOY_KEY: ${{ secrets.PVDAK_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PVDAK_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/pvdak_deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/pvdak_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/pvdak_deploy_key" > /dev/null

      - name: Upload maintenance page to the site Document Root
        env:
          DEPLOY_HOST: ${{ secrets.PVDAK_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PVDAK_SSH_USER }}
          DEPLOY_PATH: ${{ vars.PVDAK_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.PVDAK_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          SSH_OPTS=(-i "$HOME/.ssh/pvdak_deploy_key" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -p "$PORT")
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'"
          scp -i "$HOME/.ssh/pvdak_deploy_key" -P "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -- index.html "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}/index.html"
          echo "PVDak index.html deployed successfully."
